<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光与荆棘 — 粒子生长</title>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020204; }
  canvas { display: block; width: 100%; height: 100%; }
  .hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(180,210,230,0.22); font: 12px/1 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.18em; pointer-events: none; transition: opacity 1s;
  }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hint" id="hint">点击重播</div>
  <script>
  (() => {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    const DURATION = 14;
    const dpr = () => Math.min(devicePixelRatio || 1, 2);

    let W, H, cx, cy;
    let startTime = null;
    let branchParticles = [];
    let freeParticles = [];
    let branches = [];
    let blooms = [];
    let thorns = [];
    let scatterEmitted = false;
    let dissolveWaves = 0;
    let posCache = null;
    let posCacheKey = '';
    let ambientDust = [];
    let seeded = 1;
    const rand = () => { seeded = (seeded * 16807 + 1) % 2147483647; return (seeded - 1) / 2147483646; };

    const PAL = {
      core:   [255, 253, 248],
      pearl:  [248, 250, 255],
      pale:   [235, 242, 255],
      ice:    [205, 228, 255],
      cyan:   [165, 205, 245],
      blue:   [125, 175, 225],
      violet: [175, 190, 255],
      dim:    [ 75, 115, 160],
    };

    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInCubic(t) { return t * t * t; }
    function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }
    function easeInExpo(t) { return t <= 0 ? 0 : Math.pow(2, 10 * t - 10); }
    function easeInQuart(t) { return t * t * t * t; }

    function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }
    function easeInOutQuart(t) {
      return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
    }

    function haloR() { return Math.min(W, H) * 0.17; }

    function mixColor(c1, c2, t) {
      return [
        lerp(c1[0], c2[0], t),
        lerp(c1[1], c2[1], t),
        lerp(c1[2], c2[2], t),
      ];
    }

    function colorAt(dist01) {
      const d = clamp(dist01, 0, 1);
      if (d < 0.2) return mixColor(PAL.core, PAL.pearl, d / 0.2);
      if (d < 0.45) return mixColor(PAL.pearl, PAL.pale, (d - 0.2) / 0.25);
      if (d < 0.68) return mixColor(PAL.pale, PAL.ice, (d - 0.45) / 0.23);
      if (d < 0.86) return mixColor(PAL.ice, PAL.cyan, (d - 0.68) / 0.18);
      return mixColor(PAL.cyan, PAL.blue, (d - 0.86) / 0.14);
    }

    function phase(t) {
      if (t < 0.3) return { name: 'black',  p: t / 0.3 };
      if (t < 2.2) return { name: 'spark',  p: (t - 0.3) / 1.9 };
      if (t < 10.2) return { name: 'grow',   p: (t - 2.2) / 8.0 };
      if (t < 11.0) return { name: 'reach',  p: (t - 10.2) / 0.8 };
      if (t < 12.2) return { name: 'kill',  p: (t - 11.0) / 1.2 };
      return { name: 'fade', p: (t - 12.2) / 1.8 };
    }

    function easeOutBack(t) {
      const c = 1.70158;
      return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
    }

    /* ── 螺旋路径：从光晕边缘向四周舒展 ── */
    function spiralPath(baseAng, extLen, spiral, steps, haloR) {
      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const ang = baseAng + t * spiral * Math.PI * 1.4;
        const r = haloR + extLen * easeInOutQuart(t);
        const wobble = Math.sin(t * 5 + baseAng * 2) * extLen * 0.028;
        pts.push({
          t,
          x: Math.cos(ang) * (r + wobble),
          y: Math.sin(ang) * (r + wobble * 0.6),
        });
      }
      return pts;
    }

    function buildBranch(def, depth, parentEnd, haloR) {
      const scale = Math.min(W, H);
      const extLen = def.len * scale;
      const local = spiralPath(def.ang, extLen, def.spiral, 40, depth === 0 ? haloR : 0);
      const ox = parentEnd ? parentEnd.x : 0;
      const oy = parentEnd ? parentEnd.y : 0;
      const path = local.map(p => ({ t: p.t, x: ox + p.x, y: oy + p.y }));
      const end = path[path.length - 1];
      const node = { path, depth, def, id: def.id, end };
      const children = [];
      if (depth < 2 && def.forks) {
        def.forks.forEach((f, i) => {
          children.push(buildBranch({
            id: def.id * 10 + i,
            ang: f.ang,
            len: f.len,
            spiral: f.spiral ?? def.spiral * 0.65,
            forks: depth === 0 ? null : undefined,
          }, depth + 1, end, haloR));
        });
      }
      node.children = children;
      return node;
    }

    function initScene() {
      seeded = 77;
      branchParticles = [];
      freeParticles = [];
      blooms = [];
      thorns = [];
      branches = [];
      const halo = haloR();
      const count = 20;

      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2 + (rand() - 0.5) * 0.08;
        const len = 0.26 + rand() * 0.16;
        const spiral = (rand() - 0.5) * 1.0;
        const forkA = ang + 0.28 + rand() * 0.18;
        const forkB = ang - 0.28 - rand() * 0.18;
        const forkC = ang + (rand() - 0.5) * 0.55;
        branches.push(buildBranch({
          id: i,
          ang,
          len,
          spiral,
          forks: [
            { ang: forkA, len: len * (0.42 + rand() * 0.14), spiral: spiral * 0.7 },
            { ang: forkB, len: len * (0.38 + rand() * 0.12), spiral: -spiral * 0.65 },
            { ang: forkC, len: len * (0.32 + rand() * 0.1), spiral: spiral * 0.5 },
          ],
        }, 0, null, halo));
      }

      function walk(node) {
        sampleBranchParticles(node);
        node.children.forEach(walk);
      }
      branches.forEach(walk);
      placeBlooms();
      generateAllThorns();
      buildAmbientDust();
      posCacheKey = '';
    }

    function buildAmbientDust() {
      ambientDust = [];
      const n = 72;
      for (let i = 0; i < n; i++) {
        const ang = rand() * Math.PI * 2;
        const rad = Math.sqrt(rand()) * Math.min(W, H) * 0.48;
        ambientDust.push({
          bx: Math.cos(ang) * rad,
          by: Math.sin(ang) * rad * 0.85,
          size: (0.35 + rand() * 0.9) * dpr(),
          alpha: 0.04 + rand() * 0.1,
          twinkle: rand() * Math.PI * 2,
          drift: 0.15 + rand() * 0.35,
          cr: PAL.pearl[0]|0, cg: PAL.pearl[1]|0, cb: PAL.pearl[2]|0,
        });
      }
    }

    function sampleBranchParticles(node) {
      const path = node.path;
      for (let i = 0; i < path.length - 1; i++) {
        const a = path[i], b = path[i + 1];
        const segLen = Math.hypot(b.x - a.x, b.y - a.y);
        const n = Math.max(3, Math.floor(segLen / (2.4 * dpr())));
        for (let j = 0; j < n; j++) {
          const u = j / n;
          const t = lerp(a.t, b.t, u);
          const px = lerp(a.x, b.x, u);
          const py = lerp(a.y, b.y, u);
          const tx = b.x - a.x, ty = b.y - a.y;
          const tl = Math.hypot(tx, ty) || 1;
          const nx = -ty / tl, ny = tx / tl;
          const spread = (0.85 + t * 2.4 + node.depth * 0.55) * dpr();
          const ox = (rand() - 0.5) * spread;
          const oy = (rand() - 0.5) * spread * 0.72;
          const dist01 = clamp(t, 0, 1);
          const tipFray = dist01 > 0.65 ? (dist01 - 0.65) / 0.35 : 0;
          const color = colorAt(dist01);
          const sparkle = rand() < 0.12;
          branchParticles.push({
            bx: px + nx * ox, by: py + ny * oy,
            t, tipFray,
            branchId: node.id,
            depth: node.depth,
            size: (0.7 + rand() * (sparkle ? 2.0 : 1.35) - node.depth * 0.1) * dpr(),
            alpha: (0.42 + rand() * 0.48) * (1 - tipFray * 0.4),
            twinkle: rand() * Math.PI * 2,
            sparkle,
            cr: color[0]|0, cg: color[1]|0, cb: color[2]|0,
          });
        }
      }
    }

    function placeBlooms() {
      function walk(node) {
        if (node.depth >= 1) {
          const e = node.end;
          const n = 28 + Math.floor(rand() * 20);
          for (let i = 0; i < n; i++) {
            const ang = rand() * Math.PI * 2;
            const r = rand() * 16 * dpr();
            const color = colorAt(0.82 + rand() * 0.18);
            blooms.push({
              bx: e.x + Math.cos(ang) * r,
              by: e.y + Math.sin(ang) * r * 0.68,
              t: 0.9 + rand() * 0.1,
              branchId: node.id,
              depth: node.depth,
              size: (0.55 + rand() * 1.2) * dpr(),
              alpha: 0.35 + rand() * 0.5,
              twinkle: rand() * Math.PI * 2,
              sparkle: rand() < 0.35,
              cr: color[0]|0, cg: color[1]|0, cb: color[2]|0,
            });
          }
        }
        node.children.forEach(walk);
      }
      branches.forEach(walk);
    }

    function generateAllThorns() {
      thorns = [];
      function walk(node) {
        const path = node.path;
        const step = node.depth === 0 ? 5 : 4;
        for (let i = 1; i < path.length - 1; i += step) {
          const pt = path[i];
          if (pt.t < 0.25 || pt.t > 0.88) continue;
          const next = path[Math.min(i + 1, path.length - 1)];
          const tang = Math.atan2(next.y - pt.y, next.x - pt.x);
          const side = (i + node.id) % 2 === 0 ? 1 : -1;
          thorns.push({
            bx: pt.x, by: pt.y, t: pt.t,
            branchId: node.id,
            side,
            tang,
            len: (10 + rand() * 14 - node.depth * 2) * dpr(),
          });
        }
        node.children.forEach(walk);
      }
      branches.forEach(walk);
    }

    function getAnimState(ph) {
      let lightR = 0, lightI = 0, lightBlur = 0, grow = 0, reach = 0, wrap = 0, strangle = 0;
      let thornsGrow = 0, scatter = 0, fade = 0;
      const R = haloR();
      const Rmax = R * 1.38;

      if (ph.name === 'black') {
        lightI = 0; lightR = 0;
      } else if (ph.name === 'spark') {
        const p = easeOutCubic(ph.p);
        lightI = p;
        lightR = lerp(3 * dpr(), R, p);
        lightBlur = lerp(0, 12 * dpr(), p);
      } else if (ph.name === 'grow') {
        const p = easeOutQuint(easeInOutSine(ph.p));
        lightI = 1;
        lightR = lerp(R, Rmax, easeOutQuint(ph.p * 0.85));
        lightBlur = lerp(16 * dpr(), 36 * dpr(), easeInOutSine(ph.p));
        grow = p;
      } else if (ph.name === 'reach') {
        lightI = 1;
        lightR = lerp(Rmax, Rmax * 1.04, easeInOutSine(ph.p));
        lightBlur = lerp(32 * dpr(), 28 * dpr(), ph.p);
        grow = 1;
        reach = easeInOutSine(ph.p);
        wrap = ph.p * 0.15;
      } else if (ph.name === 'kill') {
        const raw = ph.p;
        const p = easeInExpo(raw);
        grow = 1; reach = 1;
        lightBlur = lerp(28 * dpr(), 0, easeInQuart(raw));
        thornsGrow = easeOutBack(Math.min(1, raw * 2.8));
        wrap = lerp(0.15, 1, p);
        strangle = p;
        const crush = easeInQuart(raw);
        lightI = lerp(1, 0.02, Math.pow(crush, 0.65));
        lightR = lerp(Rmax, R * 0.025, Math.pow(crush, 1.3));
      } else {
        const p = ph.p;
        scatter = easeOutCubic(Math.min(1, p / 0.62));
        fade = easeInQuart(Math.max(0, (p - 0.52) / 0.48));
        grow = 1; reach = 1; strangle = 1; thornsGrow = 1;
        lightBlur = 0;

        if (p < 0.18) {
          const flash = easeOutCubic(p / 0.18);
          lightI = lerp(0.05, 0.65, flash) * (1 - p / 0.18);
          lightR = lerp(R * 0.04, R * 0.45, flash);
        } else {
          lightI = 0;
          lightR = 0;
        }
      }
      return { lightR, lightI, lightBlur, grow, reach, wrap, strangle, thornsGrow, scatter, fade };
    }

    function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

    function transformPoint(bx, by, tAlong, state, branchStagger) {
      const branchOpen = clamp((state.grow - branchStagger * 0.09) / (1 - branchStagger * 0.09), 0, 1);
      const sweep = clamp((branchOpen - tAlong * 0.92) / 0.48, 0, 1);
      const reveal = easeOutQuint(sweep);
      const reachOut = state.reach * 0.06;
      const scatter = state.scatter || 0;
      const wrap = state.wrap * (1 - scatter);
      const str = state.strangle * (1 - scatter);

      const dist = Math.hypot(bx, by);
      const ang = Math.atan2(by, bx);
      const reachScale = 1 + reachOut * (1 - str);
      let x = cx + Math.cos(ang) * dist * reachScale * reveal;
      let y = cy + Math.sin(ang) * dist * reachScale * reveal;

      if (wrap > 0 || str > 0) {
        const outer = Math.pow(tAlong, 0.45);
        const curl = wrap * outer;
        const snap = str * outer;

        const orbit = ang + curl * 0.65 * (1 + snap * 0.55);
        const cageR = dist * (1 - curl * 0.12 - snap * 0.94);
        x = cx + Math.cos(orbit) * cageR * reveal;
        y = cy + Math.sin(orbit) * cageR * reveal;

        const pull = snap * (0.72 + outer * 0.52);
        x = lerp(x, cx, pull);
        y = lerp(y, cy, pull);
      }

      if (scatter > 0) {
        const burst = easeOutCubic(scatter);
        const outAng = Math.atan2(y - cy, x - cx) || ang;
        const rad = Math.hypot(x - cx, y - cy);
        const push = burst * (38 + dist * 0.65 + tAlong * 45) * dpr();
        x = cx + Math.cos(outAng) * (rad + push);
        y = cy + Math.sin(outAng) * (rad + push);
      }

      return { x, y, reveal, visible: reveal > 0.02 && (1 - state.fade) > 0.015 };
    }

    function branchStagger(id) {
      return (id % 20) * 0.065;
    }

    class FreeParticle {
      constructor(x, y, opts = {}) {
        this.x = x; this.y = y;
        const a = opts.angle ?? rand() * Math.PI * 2;
        const sp = (opts.speed ?? 0.8 + rand() * 1.6) * dpr();
        this.vx = Math.cos(a) * sp;
        this.vy = Math.sin(a) * sp;
        this.life = opts.life ?? 35 + rand() * 45;
        this.max = this.life;
        this.size = (opts.size ?? 0.7 + rand() * 1.4) * dpr();
        this.alpha = opts.alpha ?? 0.45 + rand() * 0.4;
        this.color = opts.color ?? PAL.ice;
        this.glow = opts.glow ?? 1.6;
        this.drag = opts.drag ?? 0.975;
        this.fadeRate = opts.fadeRate ?? 0.988;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vx *= this.drag; this.vy *= this.drag;
        this.vy += 0.012 * dpr();
        this.life--;
        this.alpha *= this.fadeRate;
      }
      draw(t) {
        if (this.alpha < 0.02) return;
        const [r, g, b] = this.color;
        const life01 = this.life / this.max;
        const tw = 0.65 + Math.sin(t * 5 + this.x * 0.01) * 0.35;
        const a = this.alpha * tw * (0.35 + life01 * 0.65);
        ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${a * 0.22})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.glow, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(${Math.min(255,r+20)|0},${Math.min(255,g+15)|0},${Math.min(255,b+10)|0},${a})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
      alive() { return this.life > 0 && this.alpha > 0.02; }
    }

    function emitFree(x, y, n, opts) {
      for (let i = 0; i < n; i++) freeParticles.push(new FreeParticle(x, y, opts));
    }

    function buildPosCache(state) {
      const key = `${state.grow}|${state.reach}|${state.wrap}|${state.strangle}|${state.scatter}|${state.fade}`;
      if (posCacheKey === key && posCache) return posCache;
      posCacheKey = key;
      if (!posCache || posCache.length !== branchParticles.length + blooms.length + thorns.length) {
        posCache = new Array(branchParticles.length + blooms.length + thorns.length);
      }
      let i = 0;
      for (const p of branchParticles) {
        posCache[i++] = transformPoint(p.bx, p.by, p.t, state, branchStagger(p.branchId));
      }
      for (const p of blooms) {
        posCache[i++] = transformPoint(p.bx, p.by, p.t, state, branchStagger(p.branchId));
      }
      for (const th of thorns) {
        posCache[i++] = transformPoint(th.bx, th.by, th.t, state, branchStagger(th.branchId));
      }
      return posCache;
    }

    function drawLight(state, time) {
      if (state.lightI <= 0.001) return;
      const r = state.lightR;
      const blurAmt = state.lightBlur || 0;
      const pulse = 1 + Math.sin(time * 2.2) * 0.025 * state.lightI;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      if (blurAmt > 2 * dpr()) {
        const g0 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * (3.8 + blurAmt / dpr() * 0.05) * pulse);
        g0.addColorStop(0,   `rgba(255,252,248,${0.12 * state.lightI})`);
        g0.addColorStop(0.35, `rgba(210,230,255,${0.07 * state.lightI})`);
        g0.addColorStop(0.7, `rgba(160,190,240,${0.03 * state.lightI})`);
        g0.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = g0;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 4.0 * pulse, 0, Math.PI * 2);
        ctx.fill();
      }

      const g1 = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r * 2.8 * pulse);
      g1.addColorStop(0,   `rgba(255,255,255,${0.55 * state.lightI})`);
      g1.addColorStop(0.18, `rgba(240,248,255,${0.32 * state.lightI})`);
      g1.addColorStop(0.5, `rgba(190,220,255,${0.12 * state.lightI})`);
      g1.addColorStop(0.82, `rgba(140,180,230,${0.04 * state.lightI})`);
      g1.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = g1;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 2.8 * pulse, 0, Math.PI * 2);
      ctx.fill();

      const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.65 * pulse);
      g2.addColorStop(0,   `rgba(255,255,255,${0.98 * state.lightI})`);
      g2.addColorStop(0.35, `rgba(235,245,255,${0.65 * state.lightI})`);
      g2.addColorStop(0.75, `rgba(200,225,255,${0.15 * state.lightI})`);
      g2.addColorStop(1,   'rgba(180,220,255,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.65 * pulse, 0, Math.PI * 2);
      ctx.fill();

      const ringA = 0.08 * state.lightI * (0.7 + Math.sin(time * 1.8) * 0.3);
      ctx.strokeStyle = `rgba(200,230,255,${ringA})`;
      ctx.lineWidth = 1.2 * dpr();
      ctx.beginPath();
      ctx.arc(cx, cy, r * (1.05 + Math.sin(time * 2.5) * 0.02) * pulse, 0, Math.PI * 2);
      ctx.stroke();

      const n = Math.floor(68 * state.lightI);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + time * 0.35;
        const rr = r * (0.12 + (i * 0.6180339887 % 1) * 0.62) * pulse;
        const tw = 0.55 + Math.sin(time * 3.5 + i * 0.7) * 0.45;
        const sz = (0.55 + (i % 5) * 0.18) * dpr();
        ctx.fillStyle = `rgba(235,245,255,${0.18 * state.lightI * tw})`;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, sz * 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${0.32 * state.lightI * tw})`;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, sz, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawAmbientDust(state, time) {
      if (state.lightI < 0.05 && state.fade < 0.01) return;
      const vis = clamp(state.lightI * 0.85 + (1 - state.fade) * 0.15, 0, 1);
      if (vis < 0.02) return;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const d of ambientDust) {
        const tw = 0.5 + Math.sin(time * d.drift + d.twinkle) * 0.5;
        const ox = Math.sin(time * d.drift * 0.7 + d.twinkle) * 3 * dpr();
        const oy = Math.cos(time * d.drift * 0.5 + d.twinkle) * 2 * dpr();
        const a = d.alpha * tw * vis * (1 - state.fade);
        if (a < 0.008) continue;
        ctx.fillStyle = `rgba(${d.cr},${d.cg},${d.cb},${a})`;
        ctx.beginPath();
        ctx.arc(cx + d.bx + ox, cy + d.by + oy, d.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawVignette(intensity) {
      if (intensity <= 0) return;
      const g = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.2, cx, cy, Math.max(W, H) * 0.72);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.55, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${0.42 * intensity})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function drawThorn(th, pos, state, time) {
      if (state.thornsGrow <= 0.01 || !pos.visible) return;

      const grow = state.thornsGrow * (0.6 + state.strangle * 0.4);
      const len = th.len * grow * (1 - (state.scatter || 0) * 0.6);
      const toCenter = Math.atan2(cy - pos.y, cx - pos.x);
      const outAng = Math.atan2(pos.y - cy, pos.x - cx);
      const thAng = (state.scatter || 0) > 0.15
        ? outAng + th.side * 0.22
        : toCenter + th.side * 0.28 + Math.sin(th.t * 12) * 0.08;
      const alpha = (0.5 + state.strangle * 0.45) * (1 - state.fade) * (1 - (state.scatter || 0) * 0.7);
      const steps = 4;

      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const px = pos.x + Math.cos(thAng) * len * u;
        const py = pos.y + Math.sin(thAng) * len * u;
        const sz = (0.45 + u * 1.0) * dpr() * grow;
        const tw = 0.75 + Math.sin(time * 8 + th.t * 20) * 0.25;
        const uu = u * 0.6;
        ctx.fillStyle = `rgba(${lerp(245,255,uu)|0},${lerp(250,255,uu)|0},${lerp(255,255,uu)|0},${alpha * tw * (0.5 + u * 0.5)})`;
        ctx.beginPath();
        ctx.arc(px, py, sz, 0, Math.PI * 2);
        ctx.fill();
      }

      const tx = pos.x + Math.cos(thAng) * len;
      const ty = pos.y + Math.sin(thAng) * len;
      const tipSz = 2.0 * dpr() * grow;
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.95})`;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - Math.cos(thAng - 0.5) * tipSz, ty - Math.sin(thAng - 0.5) * tipSz);
      ctx.lineTo(tx - Math.cos(thAng + 0.5) * tipSz, ty - Math.sin(thAng + 0.5) * tipSz);
      ctx.closePath();
      ctx.fill();
    }

    function drawPointParticle(p, pos, state, time, isBloom) {
      if (!pos.visible) return;

      const depthDim = p.depth === 0 ? 1 : p.depth === 1 ? 0.88 : 0.72;
      const edgeFade = 1 - Math.pow(pos.reveal, 0.55) * 0.28;
      const tw = 0.65 + Math.sin(time * (p.sparkle ? 5 : 2.8) + p.twinkle) * 0.35;
      const alpha = p.alpha * edgeFade * tw * depthDim * (1 - state.fade) * (1 - (state.scatter || 0) * 0.42);
      if (alpha < 0.02) return;

      const fray = p.tipFray || 0;
      const tipDissolve = isBloom ? 1 : clamp(1 - (p.t - 0.62) / 0.38, 0.25, 1) * (1 - fray * 0.5);
      const growPulse = isBloom ? 1 : 0.55 + pos.reveal * 0.45;
      const sz = p.size * growPulse;
      const a = alpha * tipDissolve;
      const premium = isBloom || p.sparkle || p.t > 0.82;

      if (premium) {
        ctx.fillStyle = `rgba(${p.cr},${p.cg},${p.cb},${a * 0.16})`;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, sz * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = `rgba(${Math.min(255, p.cr + 12)|0},${Math.min(255, p.cg + 10)|0},${Math.min(255, p.cb + 8)|0},${a * (premium ? 0.72 : 0.85)})`;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, sz * (premium ? 0.72 : 0.85), 0, Math.PI * 2);
      ctx.fill();

      if (premium || sz > 1.1 * dpr()) {
        ctx.fillStyle = `rgba(255,255,255,${a * (p.sparkle || isBloom ? 0.95 : 0.45)})`;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, sz * (p.sparkle ? 0.55 : 0.38), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function emitDissolveParticle(x, y, outAng, src, speedMul = 1) {
      emitFree(x, y, 1, {
        angle: outAng + (rand() - 0.5) * 1.6,
        speed: (0.6 + rand() * 2.8) * speedMul,
        color: [src.cr ?? 210, src.cg ?? 235, src.cb ?? 255],
        alpha: (src.alpha || 0.5) * (0.65 + rand() * 0.35),
        life: 70 + rand() * 90,
        size: (src.size || 1) * (0.55 + rand() * 0.55),
        glow: 1.8 + rand() * 1.2,
        drag: 0.988 + rand() * 0.008,
        fadeRate: 0.993 + rand() * 0.004,
      });
    }

    function emitScatterBurst(state) {
      const killState = { ...state, scatter: 0, strangle: 1, wrap: 1, fade: 0 };

      for (let i = 0; i < 220; i++) {
        const a = rand() * Math.PI * 2;
        const sp = 0.8 + rand() * 3.5;
        emitFree(cx, cy, 1, {
          angle: a,
          speed: sp,
          color: mixColor(PAL.core, PAL.ice, rand()),
          alpha: 0.55 + rand() * 0.4,
          life: 80 + rand() * 100,
          size: 0.6 + rand() * 2.2,
          glow: 2.0 + rand(),
          drag: 0.99,
          fadeRate: 0.993,
        });
      }

      const emitFrom = (list, step, speedMul = 1) => {
        for (let i = 0; i < list.length; i += step) {
          const p = list[i];
          const pos = transformPoint(p.bx, p.by, p.t, killState, branchStagger(p.branchId ?? 0));
          if (!pos.visible) continue;
          const outAng = Math.atan2(pos.y - cy, pos.x - cx);
          emitDissolveParticle(pos.x, pos.y, outAng, p, speedMul);
          if (rand() < 0.45) {
            emitDissolveParticle(
              pos.x + (rand() - 0.5) * 4 * dpr(),
              pos.y + (rand() - 0.5) * 4 * dpr(),
              outAng + (rand() - 0.5) * 0.8,
              p,
              speedMul * (0.7 + rand() * 0.5)
            );
          }
        }
      };

      emitFrom(branchParticles, 2, 1);
      emitFrom(blooms, 1, 1.15);

      for (let i = 0; i < thorns.length; i += 2) {
        const th = thorns[i];
        const pos = transformPoint(th.bx, th.by, th.t, killState, branchStagger(th.branchId));
        if (!pos.visible) continue;
        const outAng = Math.atan2(pos.y - cy, pos.x - cx);
        emitDissolveParticle(pos.x, pos.y, outAng, {
          cr: 245, cg: 250, cb: 255, alpha: 0.55, size: 1.1 * dpr(),
        }, 0.85);
      }
    }

    function emitDissolveWave(state, intensity) {
      const killState = { ...state, scatter: 0, strangle: 1, wrap: 1, fade: 0 };
      const count = Math.floor(120 * intensity);
      for (let n = 0; n < count; n++) {
        const p = branchParticles[(Math.random() * branchParticles.length) | 0];
        if (!p) continue;
        const pos = transformPoint(p.bx, p.by, p.t, killState, branchStagger(p.branchId));
        if (!pos.visible) continue;
        const outAng = Math.atan2(pos.y - cy, pos.x - cx);
        emitDissolveParticle(pos.x, pos.y, outAng, p, 0.75 + rand() * 0.6);
      }
      for (let n = 0; n < Math.floor(40 * intensity); n++) {
        const b = blooms[(Math.random() * blooms.length) | 0];
        if (!b) continue;
        const pos = transformPoint(b.bx, b.by, b.t, killState, branchStagger(b.branchId));
        if (!pos.visible) continue;
        const outAng = Math.atan2(pos.y - cy, pos.x - cx);
        emitDissolveParticle(pos.x, pos.y, outAng, b, 0.9);
      }
    }

    function updateFreeParticles(ph, state, time) {
      if (ph.name === 'spark' && ph.p > 0.05 && rand() < 0.85) {
        emitFree(cx, cy, 2, { speed: 0.9, color: PAL.pearl, alpha: 0.55, glow: 2.2, life: 40 });
      }
      if (ph.name === 'grow') {
        if (rand() < 0.32) {
          const p = branchParticles[(Math.random() * branchParticles.length) | 0];
          if (p && p.t > 0.15) {
            const front = state.grow;
            if (Math.abs(p.t - front) < 0.12 || (p.t > front - 0.08 && p.t < front + 0.04)) {
              const ang = Math.atan2(p.by, p.bx);
              const dist = Math.hypot(p.bx, p.by);
              const px = cx + Math.cos(ang) * dist * front;
              const py = cy + Math.sin(ang) * dist * front;
              emitFree(px, py, 1, {
                angle: ang + (rand() - 0.5) * 1.4,
                speed: 0.25 + rand() * 0.55,
                color: [p.cr, p.cg, p.cb],
                alpha: 0.35 + rand() * 0.25,
                size: 0.45 + rand() * 0.6,
                glow: 2.0,
                life: 32 + rand() * 24,
              });
            }
          }
        }
        if (rand() < 0.08) {
          emitFree(cx, cy, 1, {
            speed: 0.5 + rand() * 0.8,
            color: PAL.violet,
            alpha: 0.2,
            size: 0.4,
            glow: 2.5,
            life: 50,
          });
        }
      }
      if (ph.name === 'kill') {
        if (ph.p > 0.05 && ph.p < 0.5 && rand() < 0.3) {
          emitFree(cx, cy, 2, { speed: 2, color: PAL.core, alpha: 0.5, life: 12, size: 0.5 });
        }
        if (ph.p > 0.1 && rand() < 0.55) {
          emitFree(cx, cy, 4, { speed: 4 + ph.p * 8, color: PAL.ice, alpha: 0.85, life: 14, size: 1.0 });
        }
      }
      if (ph.name === 'fade' && ph.p < 0.05 && !scatterEmitted) {
        scatterEmitted = true;
        emitScatterBurst(state);
      }
      if (ph.name === 'fade') {
        if (ph.p > 0.12 && dissolveWaves < 1) { dissolveWaves = 1; emitDissolveWave(state, 0.85); }
        if (ph.p > 0.28 && dissolveWaves < 2) { dissolveWaves = 2; emitDissolveWave(state, 0.65); }
        if (ph.p > 0.42 && dissolveWaves < 3) { dissolveWaves = 3; emitDissolveWave(state, 0.45); }
        if (ph.p < 0.75 && rand() < 0.06) {
          emitFree(cx, cy, 1, {
            speed: 0.5 + rand() * 1.8,
            color: mixColor(PAL.pearl, PAL.cyan, rand()),
            alpha: 0.18 + rand() * 0.22,
            life: 60 + rand() * 50,
            size: 0.35 + rand() * 0.8,
            glow: 2.2,
            drag: 0.992,
            fadeRate: 0.994,
          });
        }
      }
      freeParticles.forEach(p => p.update());
      const cap = ph.name === 'fade' ? 2200 : 420;
      if (freeParticles.length > cap) freeParticles.splice(0, freeParticles.length - cap);
      freeParticles = freeParticles.filter(p => p.alive());
    }

    function frame(now) {
      if (!startTime) startTime = now;
      const t = Math.min((now - startTime) / 1000, DURATION);
      const ph = phase(t);
      const state = getAnimState(ph);
      const time = now / 1000;

      ctx.fillStyle = '#020204';
      ctx.fillRect(0, 0, W, H);

      drawAmbientDust(state, time);
      drawLight(state, time);
      updateFreeParticles(ph, state, time);

      const cache = buildPosCache(state);
      let ci = branchParticles.length + blooms.length;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      if (ph.name === 'kill' && ph.p > 0.35) {
        const sh = (1 - ph.p) * 6 * dpr();
        ctx.translate(Math.sin(time * 90) * sh, Math.cos(time * 110) * sh * 0.65);
      }

      for (let depth = 2; depth >= 0; depth--) {
        for (let i = 0; i < branchParticles.length; i++) {
          const p = branchParticles[i];
          if ((p.depth ?? 0) !== depth) continue;
          drawPointParticle(p, cache[i], state, time, false);
        }
      }
      for (let i = 0; i < blooms.length; i++) {
        drawPointParticle(blooms[i], cache[branchParticles.length + i], state, time, true);
      }

      if (state.thornsGrow > 0) {
        for (let i = 0; i < thorns.length; i++) {
          drawThorn(thorns[i], cache[ci++], state, time);
        }
      }

      freeParticles.forEach(p => p.draw(time));
      ctx.restore();

      drawVignette(ph.name === 'black' ? 0.55 : 0.38 * (1 - state.fade * 0.5));

      if (ph.name === 'kill' && ph.p > 0.25) {
        const flash = Math.sin((ph.p - 0.25) / 0.75 * Math.PI) * 0.28 * (1 - ph.p * 0.4);
        ctx.fillStyle = `rgba(220,240,255,${flash})`;
        ctx.fillRect(0, 0, W, H);
      }

      if (ph.name === 'fade' && ph.p > 0.58) {
        ctx.fillStyle = `rgba(2,2,4,${easeInCubic((ph.p - 0.58) / 0.42)})`;
        ctx.fillRect(0, 0, W, H);
      }

      hint.textContent = t >= DURATION - 0.5 ? '点击重播' : (ph.name === 'black' ? '' : '');
      hint.style.opacity = t >= DURATION - 0.5 ? '0.7' : '0';

      if (t >= DURATION) {
        startTime = null;
        freeParticles = [];
        scatterEmitted = false;
        dissolveWaves = 0;
        posCacheKey = '';
      }

      requestAnimationFrame(frame);
    }

    function resize() {
      W = canvas.width = innerWidth * dpr();
      H = canvas.height = innerHeight * dpr();
      cx = W / 2;
      cy = H / 2;
      initScene();
    }

    canvas.addEventListener('click', () => { startTime = null; freeParticles = []; scatterEmitted = false; dissolveWaves = 0; posCacheKey = ''; });
    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
